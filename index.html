<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поїздка до Велюня / Reise nach Wieluń</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F5F7FA;
  --panel:#FFFFFF;
  --ink:#16202D;
  --muted:#566275;
  --line:#D9DFE7;
  --action:#1559C7;
  --on-action:#FFFFFF;
  --action-text:#1559C7;
  --asphalt:#3B4452;
  --route:#F2B705;
  --on-route:#1B1B1B;
  --sos:#C62828;
  --font:"Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#121821;
    --panel:#1B2330;
    --ink:#EDF1F6;
    --muted:#A3AEBE;
    --line:#2E3949;
    --action:#2F6FE0;
    --on-action:#FFFFFF;
    --action-text:#8DB4FF;
    --asphalt:#4A5568;
    --route:#F2B705;
    --on-route:#1B1B1B;
    --sos:#D84343;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#121821;
  --panel:#1B2330;
  --ink:#EDF1F6;
  --muted:#A3AEBE;
  --line:#2E3949;
  --action:#2F6FE0;
  --on-action:#FFFFFF;
  --action-text:#8DB4FF;
  --asphalt:#4A5568;
  --route:#F2B705;
  --on-route:#1B1B1B;
  --sos:#D84343;
}
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:1.1875rem;
  line-height:1.5;
}
main{ max-width:600px; margin:0 auto; padding:20px 20px 56px; }

/* Language switch */
.lang-switch{
  display:flex; gap:4px; width:max-content;
  border:2px solid var(--line); border-radius:999px; padding:4px;
  background:var(--panel);
}
.lang-switch button{
  font:600 1.0625rem/1 var(--font);
  min-height:48px; padding:0 20px;
  border:0; border-radius:999px;
  background:transparent; color:var(--ink); cursor:pointer;
}
.lang-switch button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }

/* Header */
h1{
  font-size:clamp(1.9rem, 7.5vw, 2.6rem);
  font-weight:800; line-height:1.12; letter-spacing:-0.01em;
  margin:28px 0 6px;
}
.date{ font-size:1.3125rem; font-weight:600; color:var(--muted); margin:0 0 18px; }
.howto{ margin:0 0 10px; }
.weather{ color:var(--muted); margin:0 0 32px; }

/* Panels */
.panel{
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:18px;
  padding:20px 20px 10px;
  margin:0 0 40px;
}
.panel.rules{ border-color:var(--route); }
.panel h2{ font-size:1.375rem; font-weight:800; line-height:1.25; margin:0 0 14px; }
.panel ol, .panel ul{ margin:0; padding-left:1.4em; }
.panel li{ margin:0 0 14px; }
.panel li .btns{ margin-top:10px; }

/* Route */
.route-head h2{ font-size:1.625rem; font-weight:800; margin:0 0 6px; }
.late{ color:var(--muted); margin:0 0 28px; }
.route{ list-style:none; margin:0 0 44px; padding:0 0 0 60px; }
.stop{ position:relative; padding-bottom:44px; }
.stop:last-child{ padding-bottom:0; }
.stop::before{
  content:""; position:absolute;
  left:-40px; top:20px; bottom:-20px; width:14px;
  background:var(--asphalt);
}
.stop::after{
  content:""; position:absolute;
  left:-34px; top:34px; bottom:-8px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--route) 0 12px, transparent 12px 24px);
}
.stop:last-child::before, .stop:last-child::after{ display:none; }
.marker{
  position:absolute; left:-52px; top:-2px; z-index:1;
  width:38px; height:38px; border-radius:50%;
  background:var(--route); color:var(--on-route);
  font-weight:800; font-size:1.125rem;
  display:grid; place-items:center;
  box-shadow:0 0 0 4px var(--paper);
}
.time{ font-size:1.5rem; font-weight:800; line-height:1.2; margin:2px 0 2px; font-variant-numeric:tabular-nums; }
.stop h3{ font-size:1.3125rem; font-weight:600; line-height:1.3; margin:0 0 10px; }
.stop ul, .stop ol{ margin:0; padding-left:1.2em; }
.stop li{ margin:0 0 8px; }
.note{ font-weight:600; margin:12px 0 0; }

/* Buttons */
.btns{ display:grid; gap:12px; margin-top:16px; }
.btn{
  display:flex; align-items:center; gap:14px;
  width:100%; min-height:62px; padding:14px 18px;
  border-radius:14px; border:2px solid var(--action);
  font:600 1.15rem/1.3 var(--font);
  text-decoration:none;
}
.btn svg{ flex:0 0 auto; width:28px; height:28px; }
.btn.go{ background:var(--action); color:var(--on-action); }
.btn.alt{ background:transparent; color:var(--action-text); }
.btn.call{ background:var(--sos); border-color:var(--sos); color:#FFFFFF; }
.btn.call-son{ background:#1E7D3A; border-color:#1E7D3A; color:#FFFFFF; }
.top-call{ margin:6px 0 16px; }
.btn:active{ transform:translateY(1px); }
a:focus-visible, button:focus-visible{ outline:3px solid var(--route); outline-offset:3px; }

.sos p{ color:var(--muted); margin:10px 0 0; }

@media (prefers-reduced-motion: reduce){
  .btn:active{ transform:none; }
}
</style>
</head>
<body>
<main>
  <div class="lang-switch" role="group" aria-label="Мова / Sprache">
    <button type="button" data-lang="uk" aria-pressed="true">Українська</button>
    <button type="button" data-lang="de" aria-pressed="false">Deutsch</button>
  </div>

  <header>
    <h1 id="title"></h1>
    <p class="date" id="date"></p>
    <p class="howto" id="howto"></p>
    <div class="btns top-call" id="topCall"></div>
    <p class="weather" id="weather"></p>
  </header>

  <section class="panel" aria-labelledby="prepTitle">
    <h2 id="prepTitle"></h2>
    <ol id="prep"></ol>
  </section>

  <section aria-labelledby="routeTitle">
    <div class="route-head"><h2 id="routeTitle"></h2></div>
    <p class="late" id="late"></p>
    <ol class="route" id="route"></ol>
  </section>

  <section class="panel rules" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle"></h2>
    <ul id="rules"></ul>
  </section>

  <section class="sos">
    <div class="btns" id="sosBtn"></div>
    <p id="sosHint"></p>
  </section>
</main>

        buttons: [[NAV_HOTEL, "Route zum Hotel in Wieluń", "go", ICON_PIN]] },
      { time: "≈ 16:00", title: "Hotel Pod Ratuszem, Wieluń",
        items: [
          "Adresse: ul. Królewska 9, Wieluń.",
          "Das Hotel hat einen eigenen kostenlosen Parkplatz.",
          "Wir freuen uns auf Sie!"
        ] }
    ],
    rulesTitle: "Für den Fahrer: Das ist in Polen anders",
    rules: [
      "Licht immer einschalten, auch tagsüber.",
      "In Ortschaften höchstens 50 km/h – tagsüber und nachts.",
      "Fußgänger schon vorlassen, wenn sie den Zebrastreifen gerade betreten.",
      "Autobahn bis 140, Schnellstraße bis 120, außerorts bis 90 km/h.",
      "Abstand auf Autobahn und Schnellstraße: mindestens halber Tacho in Metern, bei 120 km/h also 60 m.",
      "Alkohol: praktisch null (Grenze 0,2 Promille).",
      "In Wrocław gibt es keine Umweltzone – keine Plakette nötig."
    ],
    callSon: "Vadym anrufen",
    sos: "Notruf: 112",
    sosHint: "Eine Nummer für Polizei, Rettungsdienst und Feuerwehr."
  }
};

function btnHtml(b){
  const [href, label, kind, icon] = b;
  const ext = href.indexOf("tel:") === 0 ? '' : ' target="_blank" rel="noopener"';
  return '<a class="btn ' + kind + '" href="' + href + '"' + ext + '>' + icon + '<span>' + label + '</span></a>';
}

function render(lang){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.title = d.pageTitle;
  document.getElementById("title").textContent = d.title;
  document.getElementById("date").textContent = d.date;
  document.getElementById("howto").innerHTML = d.howto;
  document.getElementById("weather").textContent = d.weather;
  document.getElementById("prepTitle").textContent = d.prepTitle;
  document.getElementById("prep").innerHTML = d.prep.map(p =>
    '<li>' + p.t + (p.b ? '<div class="btns">' + p.b.map(btnHtml).join("") + '</div>' : '') + '</li>'
  ).join("");
  document.getElementById("routeTitle").textContent = d.routeTitle;
  document.getElementById("late").textContent = d.late;
  document.getElementById("route").innerHTML = d.steps.map((s, i) => {
    const tag = s.ordered ? "ol" : "ul";
    return '<li class="stop">' +
      '<span class="marker" aria-hidden="true">' + (i + 1) + '</span>' +
      '<p class="time">' + s.time + '</p>' +
      '<h3>' + s.title + '</h3>' +
      '<' + tag + '>' + s.items.map(x => '<li>' + x + '</li>').join("") + '</' + tag + '>' +
      (s.note ? '<p class="note">' + s.note + '</p>' : '') +
      (s.buttons ? '<div class="btns">' + s.buttons.map(btnHtml).join("") + '</div>' : '') +
      '</li>';
  }).join("");
  document.getElementById("rulesTitle").textContent = d.rulesTitle;
  document.getElementById("rules").innerHTML = d.rules.map(r => '<li>' + r + '</li>').join("");
  document.getElementById("sosBtn").innerHTML = btnHtml([CALL_SON, d.callSon, "call-son", ICON_PHONE]) + '<a class="btn call" href="tel:112">' + ICON_PHONE + '<span>' + d.sos + '</span></a>';
  document.getElementById("sosHint").textContent = d.sosHint;
  document.getElementById("topCall").innerHTML = btnHtml([CALL_SON, d.callSon, "call-son", ICON_PHONE]);
  document.querySelectorAll(".lang-switch button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang))
  );
  try { localStorage.setItem("trip-lang", lang); } catch (e) {}
}

let start = (location.hash || "").replace("#", "");
if (!T[start]) {
  try { start = localStorage.getItem("trip-lang") || ""; } catch (e) { start = ""; }
}
if (!T[start]) start = "uk";

document.querySelectorAll(".lang-switch button").forEach(b =>
  b.addEventListener("click", () => { render(b.dataset.lang); window.scrollTo(0, 0); })
);
render(start);
</script>
</body>
</html>
