<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дорога додому / Heimfahrt</title>
<meta name="theme-color" content="#1559C7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F5F7FA;
  --panel:#FFFFFF;
  --ink:#16202D;
  --muted:#566275;
  --line:#D9DFE7;
  --action:#1559C7;
  --on-action:#FFFFFF;
  --action-text:#1559C7;
  --asphalt:#3B4452;
  --route:#F2B705;
  --on-route:#1B1B1B;
  --sos:#C62828;
  --msg:#1E7D3A;
  --msg-text:#1E7D3A;
  --wx-bg:#EAF1FB;
  --font:"Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#121821;
    --panel:#1B2330;
    --ink:#EDF1F6;
    --muted:#A3AEBE;
    --line:#2E3949;
    --action:#2F6FE0;
    --on-action:#FFFFFF;
    --action-text:#8DB4FF;
    --asphalt:#4A5568;
    --route:#F2B705;
    --on-route:#1B1B1B;
    --sos:#D84343;
    --msg:#3FA35B;
    --msg-text:#7FD69A;
    --wx-bg:#1F2B3D;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#121821;
  --panel:#1B2330;
  --ink:#EDF1F6;
  --muted:#A3AEBE;
  --line:#2E3949;
  --action:#2F6FE0;
  --on-action:#FFFFFF;
  --action-text:#8DB4FF;
  --asphalt:#4A5568;
  --route:#F2B705;
  --on-route:#1B1B1B;
  --sos:#D84343;
  --msg:#3FA35B;
  --msg-text:#7FD69A;
  --wx-bg:#1F2B3D;
}
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%; }
html[data-size="lg"]{ font-size:118%; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:1.1875rem;
  line-height:1.5;
}
main{ max-width:600px; margin:0 auto; padding:20px 20px 56px; }

/* Top bar */
.topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.lang-switch{
  display:flex; gap:4px; width:max-content;
  border:2px solid var(--line); border-radius:999px; padding:4px;
  background:var(--panel);
}
.lang-switch button{
  font:600 1.0625rem/1 var(--font);
  min-height:48px; padding:0 18px;
  border:0; border-radius:999px;
  background:transparent; color:var(--ink); cursor:pointer;
}
.lang-switch button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
.size-btn{
  min-height:56px; min-width:60px; padding:0 14px;
  border:2px solid var(--line); border-radius:999px;
  background:var(--panel); color:var(--ink);
  font:800 1.125rem/1 var(--font); cursor:pointer;
}

/* Header */
h1{
  font-size:clamp(1.9rem, 7.5vw, 2.6rem);
  font-weight:800; line-height:1.12; letter-spacing:-0.01em;
  margin:28px 0 6px;
}
.date{ font-size:1.3125rem; font-weight:600; color:var(--muted); margin:0 0 18px; }
.howto{ margin:0 0 10px; }
.top-call{ margin:6px 0 28px; }

/* Banner */
.now{
  background:var(--panel);
  border:2px solid var(--route); border-left-width:10px;
  border-radius:18px;
  padding:16px 18px 18px;
  margin:0 0 36px;
}
.now-label{ margin:0; color:var(--muted); font-weight:600; font-size:1rem; }
.now-title{ margin:2px 0 4px; font-size:1.375rem; font-weight:800; line-height:1.25; }
.now-line{ margin:0; }
.dep-line{ margin:14px 0 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:600; }
.dep-line input{
  font:600 1.15rem/1 var(--font); min-height:48px; padding:6px 10px;
  border:2px solid var(--line); border-radius:12px;
  background:var(--panel); color:var(--ink);
}

/* Panels */
.panel{
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:18px;
  padding:20px 20px 10px;
  margin:0 0 40px;
}
.panel.rules{ border-color:var(--route); }
.panel h2{ font-size:1.375rem; font-weight:800; line-height:1.25; margin:0 0 14px; }
.panel ol, .panel ul{ margin:0; padding-left:1.4em; }
.panel li{ margin:0 0 14px; }
.panel li .btns{ margin-top:10px; }
.sub{ display:block; margin-top:6px; color:var(--muted); font-size:1rem; }
details.prep > summary{ cursor:pointer; list-style:none; }
details.prep > summary::-webkit-details-marker{ display:none; }
details.prep > summary h2{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
details.prep > summary h2::after{ content:"▾"; color:var(--muted); font-size:1.1rem; }
details.prep:not([open]) > summary h2{ margin-bottom:10px; }
details.prep:not([open]) > summary h2::after{ content:"▸"; }

/* Route */
.route-head h2{ font-size:1.625rem; font-weight:800; margin:0 0 6px; }
.late{ color:var(--muted); margin:0 0 28px; }
.route{ list-style:none; margin:0 0 44px; padding:0 0 0 60px; }
.stop{ position:relative; padding-bottom:44px; }
.stop:last-child{ padding-bottom:0; }
.stop::before{
  content:""; position:absolute;
  left:-40px; top:20px; bottom:-20px; width:14px;
  background:var(--asphalt);
}
.stop::after{
  content:""; position:absolute;
  left:-34px; top:34px; bottom:-8px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--route) 0 12px, transparent 12px 24px);
}
.stop:last-child::before, .stop:last-child::after{ display:none; }
.marker{
  position:absolute; left:-52px; top:-2px; z-index:1;
  width:38px; height:38px; border-radius:50%;
  background:var(--route); color:var(--on-route);
  font-weight:800; font-size:1.125rem;
  display:grid; place-items:center;
  box-shadow:0 0 0 4px var(--paper);
}
.stop.is-now .marker{ box-shadow:0 0 0 4px var(--paper), 0 0 0 8px var(--action); }
.time{ font-size:1.5rem; font-weight:800; line-height:1.2; margin:2px 0 2px; font-variant-numeric:tabular-nums; }
.now-tag{
  display:inline-block; margin-left:10px; padding:3px 10px; border-radius:999px;
  background:var(--action); color:var(--on-action);
  font-size:0.9rem; font-weight:600; vertical-align:middle;
}
.stop h3{ font-size:1.3125rem; font-weight:600; line-height:1.3; margin:0 0 10px; }
.stop ul, .stop ol{ margin:0; padding-left:1.2em; }
.stop li{ margin:0 0 8px; }
.note{ font-weight:600; margin:12px 0 0; }
.wx{ margin:14px 0 0; padding:10px 14px; border-radius:12px; background:var(--wx-bg); font-weight:600; line-height:1.4; }
.wx:empty{ display:none; }

/* Live location how-to */
details.live{
  margin-top:16px; padding:0 16px;
  border:2px solid var(--line); border-radius:14px;
  background:var(--panel);
}
details.live > summary{ cursor:pointer; padding:14px 0; font-weight:600; }
details.live[open]{ padding-bottom:14px; }
details.live ol{ margin:4px 0 0; padding-left:1.3em; }

/* Buttons */
.btns{ display:grid; gap:12px; margin-top:16px; }
.btn{
  -webkit-appearance:none; appearance:none;
  display:flex; align-items:center; gap:14px;
  width:100%; min-height:62px; padding:14px 18px;
  border-radius:14px; border:2px solid var(--action);
  font:600 1.15rem/1.3 var(--font);
  text-decoration:none; text-align:left; cursor:pointer;
}
.btn svg{ flex:0 0 auto; width:28px; height:28px; }
.btn.go{ background:var(--action); color:var(--on-action); }
.btn.alt{ background:transparent; color:var(--action-text); }
.btn.msg{ background:transparent; color:var(--msg-text); border-color:var(--msg); }
.btn.call{ background:var(--sos); border-color:var(--sos); color:#FFFFFF; }
.btn.call-son{ background:#1E7D3A; border-color:#1E7D3A; color:#FFFFFF; }
.btn:active{ transform:translateY(1px); }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible{ outline:3px solid var(--route); outline-offset:3px; }

.sos p{ color:var(--muted); margin:10px 0 0; }
.credits{ margin-top:28px; color:var(--muted); font-size:0.95rem; }
.credits a{ color:inherit; }

@media (prefers-reduced-motion: reduce){
  .btn:active{ transform:none; }
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="lang-switch" role="group" aria-label="Мова / Sprache">
      <button type="button" data-lang="uk" aria-pressed="true">Українська</button>
      <button type="button" data-lang="de" aria-pressed="false">Deutsch</button>
    </div>
    <button type="button" class="size-btn" id="sizeBtn" aria-pressed="false">A+</button>
  </div>

  <header>
    <h1 id="title"></h1>
    <p class="date" id="date"></p>
    <p class="howto" id="howto"></p>
    <div class="btns top-call" id="topCall"></div>
  </header>

  <section class="now" id="now" aria-live="polite">
    <p class="now-label" id="nowLabel"></p>
    <p class="now-title" id="nowTitle"></p>
    <p class="now-line" id="nowLine"></p>
    <p class="now-line" id="darkLine" hidden></p>
    <div class="btns" id="nowBtn"></div>
    <p class="dep-line" id="depLine" hidden></p>
  </section>

  <section aria-labelledby="routeTitle">
    <div class="route-head"><h2 id="routeTitle"></h2></div>
    <p class="late" id="late"></p>
    <ol class="route" id="route"></ol>
  </section>

  <section class="panel rules" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle"></h2>
    <ul id="rules"></ul>
  </section>

  <section class="sos">
    <div class="btns" id="sosBtn"></div>
    <p id="sosHint"></p>
  </section>

  <footer class="credits" id="credits"></footer>
</main>

<script>
/* ---------- return trip: Wieluń → shop in Kępno → home in Berlin (minutes after midnight) ---------- */
const DRIVE_TO_SHOP = 45;        // Wieluń → Kępno, ~45 km (estimate)
const SHOP_TIME = 45;            // time for shopping
const DRIVE_HOME = 270;          // Kępno → Berlin, ~430 km, ~4.5 h without stops (estimate)
const BREAKS = 40;               // two breaks of ~20 min
const FIRST_BREAK_AFTER = 120;   // ~2 h after the shop, around Legnica
const DIRECT_HOME = DRIVE_TO_SHOP + DRIVE_HOME;   // without the shop
const SUGGESTED_DEP = 10 * 60;   // used when planning the next day
const SHOP_HOURS = { sun: [10 * 60, 19 * 60], other: [9 * 60, 20 * 60] };   // Google Maps listing
const HOME = { lat: 52.48614, lon: 13.4467 };

const PHONE = "48881445735";
const WA = "https://wa.me/" + PHONE;
const CALL_SON = "tel:+" + PHONE;
const NAV_SHOP = "https://www.google.com/maps/dir/?api=1&destination=KRAJ%20MARKET%2C%20Boczna%202B%2C%20K%C4%99pno&destination_place_id=ChIJ-XpB3GYLEEcRdKetV-b-6lQ&travelmode=driving&dir_action=navigate";
const NAV_HOME = "https://www.google.com/maps/dir/?api=1&destination=Wildenbruchstra%C3%9Fe%20%26%20Harzer%20Stra%C3%9Fe%2C%2012059%20Berlin&destination_place_id=EkZXaWxkZW5icnVjaHN0ci4gJiBIYXJ6ZXIgU3RyLiwgQmV6aXJrIE5ldWvDtmxsbiwgMTIwNTkgQmVybGluLCBHZXJtYW55ImYiZAoUChIJW0_j46hPqEcRXYBpkOYkZrUSFAoSCVtP4-OoT6hHEV2AaZDmJGa1GhQKEglRpkrvqE-oRxHF0Xt6GH7z6hoUChIJqWnWVqhPqEcRdQSRyAow_5ciCg19yUgfFZu_Awg&travelmode=driving&dir_action=navigate";

const ICON_PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const ICON_PHONE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const ICON_CHAT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9.5L5 21.5V18H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>';
const ICON_CAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.2 6.6A2 2 0 0 1 7.1 5h9.8a2 2 0 0 1 1.9 1.6L20 11a2 2 0 0 1 1 1.7V17a1 1 0 0 1-1 1h-1v1.5a1.5 1.5 0 0 1-3 0V18H8v1.5a1.5 1.5 0 0 1-3 0V18H4a1 1 0 0 1-1-1v-4.3A2 2 0 0 1 4 11l1.2-4.4zM6.4 10h11.2l-.8-3H7.2l-.8 3zM6.5 15.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm11 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>';

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const hm = (m) => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
const approx = (m) => hm(Math.round(m / 5) * 5);
function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function btnHtml(b){
  const [href, label, kind, icon, id] = b;
  const ext = href.indexOf("tel:") === 0 ? "" : ' target="_blank" rel="noopener"';
  return '<a class="btn ' + kind + '" href="' + href + '"' + ext + (id ? ' id="' + id + '"' : '') + '>' + icon + '<span>' + label + '</span></a>';
}
function waText(text){ return WA + "?text=" + encodeURIComponent(text); }
function ymd(dt){ return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()); }

/* Sunset (NOAA approximation, ±2 min), in local clock minutes — works offline and handles the clock change. */
function sunsetMinutes(lat, lon, dt){
  const y = dt.getFullYear(), mo = dt.getMonth(), d = dt.getDate(), rad = Math.PI / 180;
  const doy = Math.round((Date.UTC(y, mo, d) - Date.UTC(y, 0, 0)) / 86400000);
  const g = 2 * Math.PI / 365 * (doy - 1);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad;
  return Math.round(720 - 4 * (lon - ha) - eqt - new Date(y, mo, d, 12).getTimezoneOffset());
}

/* ---------- the adaptive plan ---------- */
function makePlan(D, dt){
  const sunday = dt.getDay() === 0;
  const [open, close] = sunday ? SHOP_HOURS.sun : SHOP_HOURS.other;
  const p = { D: D, open: open, close: close, sunday: sunday };
  p.S0 = D + DRIVE_TO_SHOP;
  p.shopStart = Math.max(p.S0, open);
  p.wait = p.shopStart - p.S0;
  if (p.shopStart <= close - 20) {
    p.mode = "shop";
    p.shopEnd = Math.min(p.shopStart + SHOP_TIME, close);
    p.breakAt = p.shopEnd + FIRST_BREAK_AFTER;
    p.H = p.shopEnd + DRIVE_HOME + BREAKS;
  } else {
    p.mode = "noshop";
    p.breakAt = D + DRIVE_TO_SHOP + FIRST_BREAK_AFTER;
    p.H = D + DIRECT_HOME + BREAKS;
  }
  p.sunset = sunsetMinutes(HOME.lat, HOME.lon, dt);
  return p;
}
/* Latest departure that still gets them home before dark (searching back in 5-minute steps). */
function latestDaylightDeparture(dt){
  for (let D = 20 * 60; D >= 6 * 60; D -= 5) { const x = makePlan(D, dt); if (x.H <= x.sunset) return D; }
  return null;
}

/* ---------- texts ---------- */
const T = {
  uk: {
    locale: "uk-UA",
    pageTitle: "Дорога додому: Велюнь → Берлін",
    title: "Велюнь → Кемпно → Берлін",
    howto: "<strong>Сині кнопки</strong> відкривають Google Maps з маршрутом, <strong>зелені</strong> — повідомлення або дзвінок Вадиму. Щоб повернутися до плану, знову відкрийте браузер або іконку на екрані телефона.",
    callSon: "Подзвонити Вадиму",
    bigger: "Збільшити шрифт", smaller: "Зменшити шрифт",
    routeTitle: "Дорога додому",
    late: "План сам підлаштовується під час, коли ви рушите. Не поспішайте — їдьте спокійно, з перервами.",
    steps: (p, departed, tomorrow) => {
      const s = [];
      const shop = p.mode === "shop";
      s.push({ k: "dep", s: p.D, time: departed ? hm(p.D) : "Коли будете готові", title: "Виїзд з Велюня",
        items: shop ? [
          "Натисніть синю кнопку, коли вже сидите в машині. Якщо навігація не почалася сама, натисніть унизу «Старт» (Start).",
          "До магазину в Кемпно близько 45 км — приблизно 45 хвилин."
        ] : [
          "Магазин сьогодні вже не встигнете (працює до " + hm(p.close) + "), тож їдьте одразу додому.",
          "Натисніть синю кнопку, коли вже сидите в машині. Якщо навігація не почалася сама, натисніть унизу «Старт» (Start).",
          "Дорога близько 470 км, приблизно 5 годин без зупинок."
        ],
        wx: { place: "wielun", at: p.D },
        buttons: [shop ? [NAV_SHOP, "Маршрут до магазину в Кемпно", "go", ICON_PIN] : [NAV_HOME, "Маршрут додому", "go", ICON_PIN]],
        live: true });
      if (shop) {
        const items = ["Український продуктовий магазин KRAJ MARKET: вул. Boczna 2B, Kępno.",
                       (tomorrow ? "Завтра працює з " : "Сьогодні працює з ") + hm(p.open) + " до " + hm(p.close) + "."];
        if (p.wait >= 5) items.push("Ви будете там ≈ " + approx(p.S0) + ", а магазин відкривається о " + hm(p.open) + " — трохи зачекайте або виїжджайте пізніше.");
        items.push("На закупи закладено ≈ 45 хвилин — не поспішайте.");
        s.push({ k: "shop", s: p.shopStart, time: "≈ " + approx(p.shopStart), title: "Закупи в Кемпно", items: items });
        s.push({ k: "drive", s: p.shopEnd, time: "≈ " + approx(p.shopEnd), title: "Їдемо додому",
          items: [
            "Ще на парковці магазину натисніть синю кнопку й дочекайтеся, поки з’явиться маршрут.",
            "До дому близько 430 км, приблизно 4 год 30 хв без зупинок.",
            "Найпростіше — через Вроцлав, як і їхали сюди: S8 → A8 → A4 → A18 → кордон біля Forst → A15. Платних доріг тут немає.",
            "Якщо Google Maps запропонує маршрут через Познань (A2) — там платна ділянка, тож краще вибрати варіант через Вроцлав."
          ],
          buttons: [[NAV_HOME, "Маршрут додому", "go", ICON_PIN]],
          msg: ["Написати Вадиму: їдемо додому", "Закупилися, їдемо додому 🚗"] });
      }
      s.push({ k: "break", s: p.breakAt, time: "≈ " + approx(p.breakAt), title: "Перерва 20–30 хвилин",

function fmtDur(m){
  const d = T[LANG], h = Math.floor(m / 60), r = m % 60;
  if (h && r) return h + " " + d.hShort + " " + r + " " + d.mShort;
  if (h) return h + " " + d.hShort;
  return r + " " + d.mShort;
}

/* ---------- state ---------- */
let LANG = "uk";
let BIG = load("trip-size") === "lg";
let WX = null;
let STEPS = [];
let PLAN = null;
let PLAN_DATE = null;
let DEPARTED = false;
let TOMORROW = false;
let LAST_KEY = "";

function nowInfo(){
  const qs = new URLSearchParams(location.search);
  let dt = new Date();
  const qd = qs.get("date");                                     // preview: ?date=2026-10-25
  if (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)) { const a = qd.split("-").map(Number); dt = new Date(a[0], a[1] - 1, a[2], dt.getHours(), dt.getMinutes()); }
  let mins = dt.getHours() * 60 + dt.getMinutes();
  const qt = qs.get("test");                                     // preview: ?test=09:10
  if (qt && /^\d{1,2}:\d{2}$/.test(qt)) { const a = qt.split(":").map(Number); mins = a[0] * 60 + a[1]; }
  return { dt: new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), mins: mins };
}
function getDeparture(day){
  const q = new URLSearchParams(location.search).get("dep");     // preview: ?dep=10:00
  if (q && /^\d{1,2}:\d{2}$/.test(q)) { const a = q.split(":").map(Number); return a[0] * 60 + a[1]; }
  try { const v = JSON.parse(load("trip-ret-dep") || "null"); if (v && v.date === day && typeof v.m === "number") return v.m; } catch (e) {}
  return null;
}
function setDeparture(day, m){ store("trip-ret-dep", JSON.stringify({ date: day, m: m })); }

function computePlan(){
  const info = nowInfo();
  const today = ymd(info.dt);
  const dep = getDeparture(today);
  DEPARTED = dep != null;
  TOMORROW = !DEPARTED && info.mins >= 17 * 60;
  let day = info.dt, D;
  if (DEPARTED) D = dep;
  else if (TOMORROW) { day = new Date(info.dt.getFullYear(), info.dt.getMonth(), info.dt.getDate() + 1); D = SUGGESTED_DEP; }
  else D = Math.ceil(info.mins / 5) * 5;
  PLAN_DATE = day;
  PLAN = makePlan(D, day);
  return [LANG, DEPARTED, TOMORROW, ymd(day), D].join("|");
}

/* ---------- page ---------- */
function liveHtml(d){
  return '<details class="live"><summary>' + d.live.summary + '</summary>' +
    '<ol>' + d.live.steps.map((x) => '<li>' + x + '</li>').join("") + '</ol>' +
    '<p class="note">' + d.live.note + '</p>' +
    '<div class="btns">' + btnHtml([WA, d.live.btn, "msg", ICON_CHAT]) + '</div></details>';
}

function render(){
  const d = T[LANG];
  const liveOpen = !!document.querySelector("details.live[open]");
  const prevWxDay = PLAN_DATE ? ymd(PLAN_DATE) : null;
  LAST_KEY = computePlan();
  STEPS = d.steps(PLAN, DEPARTED, TOMORROW);

  document.documentElement.lang = LANG;
  document.title = d.pageTitle;
  $("title").textContent = d.title;
  let dateText = "";
  try { dateText = new Intl.DateTimeFormat(d.locale, { weekday: "long", day: "numeric", month: "long" }).format(PLAN_DATE); } catch (e) {}
  $("date").textContent = dateText ? dateText.charAt(0).toUpperCase() + dateText.slice(1) : "";
  $("howto").innerHTML = d.howto;
  $("topCall").innerHTML = btnHtml([CALL_SON, d.callSon, "call-son", ICON_PHONE]);

  $("routeTitle").textContent = d.routeTitle;
  $("late").textContent = d.late;
  $("route").innerHTML = STEPS.map((s, i) => {
    const bs = (s.buttons || []).slice();
    if (s.msg) bs.push([waText(s.msg[1]), s.msg[0], "msg", ICON_CHAT]);
    return '<li class="stop" data-k="' + s.k + '">' +
      '<span class="marker" aria-hidden="true">' + (i + 1) + '</span>' +
      '<p class="time">' + s.time + '</p>' +
      '<h3>' + s.title + '</h3>' +
      '<ul>' + s.items.map((x) => '<li>' + x + '</li>').join("") + '</ul>' +
      (s.wx ? '<p class="wx" data-i="' + i + '"></p>' : '') +
      (bs.length ? '<div class="btns">' + bs.map(btnHtml).join("") + '</div>' : '') +
      (s.live ? liveHtml(d) : '') +
      '</li>';
  }).join("");
  if (liveOpen) { const l = document.querySelector("details.live"); if (l) l.open = true; }

  $("rulesTitle").textContent = d.rulesTitle;
  $("rules").innerHTML = d.rules.map((r) => '<li>' + r + '</li>').join("");
  $("sosBtn").innerHTML = btnHtml([CALL_SON, d.callSon, "call-son", ICON_PHONE]) +
    '<a class="btn call" href="tel:112">' + ICON_PHONE + '<span>' + d.sos + '</span></a>';
  $("sosHint").textContent = d.sosHint;

  document.querySelectorAll(".lang-switch button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG))
  );
  applySize();
  fillWeather();
  updateNow();
  store("trip-lang", LANG);
  if (prevWxDay && prevWxDay !== ymd(PLAN_DATE)) loadWeather();
}

function applySize(){
  const d = T[LANG], b = $("sizeBtn");
  if (BIG) document.documentElement.setAttribute("data-size", "lg");
  else document.documentElement.removeAttribute("data-size");
  b.textContent = BIG ? "A−" : "A+";
  b.setAttribute("aria-label", BIG ? d.smaller : d.bigger);
  b.setAttribute("aria-pressed", String(BIG));
}

/* ---------- banner ---------- */
function updateNow(){
  const d = T[LANG], box = $("now");
  const stops = document.querySelectorAll(".stop");
  stops.forEach((s) => s.classList.remove("is-now"));
  document.querySelectorAll(".now-tag").forEach((t) => t.remove());
  const info = nowInfo(), mins = info.mins;
  if (DEPARTED && mins >= PLAN.H + 90) { box.hidden = true; return; }

  let idx = 0, label, title, line, tagText;
  const dark = $("darkLine");
  if (!DEPARTED) {
    label = TOMORROW ? d.tomorrowLabel : d.readyLabel;
    title = d.readyTitle;
    line = d.readyLine(PLAN, TOMORROW);
    tagText = d.nextTag;
    const latest = latestDaylightDeparture(PLAN_DATE);
    const stillPossible = latest != null && (TOMORROW || latest >= PLAN.D);
    dark.textContent = stillPossible ? d.darkAdvice(PLAN.sunset, latest) : d.darkLate(PLAN.sunset);
    dark.hidden = false;
    $("nowBtn").innerHTML = TOMORROW ? "" :
      '<button type="button" class="btn call-son" id="departBtn">' + ICON_CAR + '<span>' + d.departBtn + '</span></button>';
    if (!TOMORROW) $("departBtn").addEventListener("click", () => { setDeparture(ymd(nowInfo().dt), nowInfo().mins); render(); });
    $("depLine").hidden = true;
  } else {
    for (let i = 0; i < STEPS.length; i++) if (STEPS[i].s <= mins) idx = i;
    const k = STEPS[idx].k;
    label = d.nowLabel; title = (idx + 1) + ". " + STEPS[idx].title; tagText = d.nowTag;
    line = k === "shop" ? d.lines.shop(PLAN, PLAN.shopEnd - mins > 0 ? fmtDur(PLAN.shopEnd - mins) : "") : d.lines[k](PLAN);
    dark.hidden = true;
    $("nowBtn").innerHTML = '<button type="button" class="btn alt" id="nowGo">' + ICON_DOWN + '<span>' + d.show + '</span></button>';
    $("nowGo").onclick = () => {
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const el = document.querySelectorAll(".stop")[idx];
      if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    };
    const dl = $("depLine");
    dl.innerHTML = '<label for="depInput">' + d.depLabel + '</label><input type="time" id="depInput" value="' + hm(PLAN.D) + '">';
    dl.hidden = false;
    $("depInput").addEventListener("change", (e) => {
      const v = e.target.value;
      if (/^\d{1,2}:\d{2}$/.test(v)) { const a = v.split(":").map(Number); setDeparture(ymd(nowInfo().dt), a[0] * 60 + a[1]); render(); }
    });
  }
  const stop = stops[idx];
  if (stop) {
    stop.classList.add("is-now");
    const tm = stop.querySelector(".time");
    if (tm) tm.insertAdjacentHTML("beforeend", '<span class="now-tag">' + tagText + '</span>');
  }
  $("nowLabel").textContent = label;
  $("nowTitle").textContent = title;
  $("nowLine").textContent = line;
  box.hidden = false;
}

function tick(){
  const keep = [PLAN, PLAN_DATE, DEPARTED, TOMORROW];
  const key = computePlan();
  [PLAN, PLAN_DATE, DEPARTED, TOMORROW] = keep;
  if (key !== LAST_KEY) render(); else updateNow();
}

  legnica: { lat: 51.2070, lon: 16.1553 },
  berlin:  { lat: HOME.lat, lon: HOME.lon }
};
function wmo(c){
  if (c === 0) return ["☀️", "ясно", "klar"];
  if (c === 1 || c === 2) return ["🌤️", "мінлива хмарність", "leicht bewölkt"];
  if (c === 3) return ["☁️", "хмарно", "bewölkt"];
  if (c === 45 || c === 48) return ["🌫️", "туман", "Nebel"];
  if (c >= 51 && c <= 57) return ["🌦️", "мряка", "Nieselregen"];
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return ["🌧️", "дощ", "Regen"];
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ["🌨️", "сніг", "Schnee"];
  if (c >= 95) return ["⛈️", "гроза", "Gewitter"];
  return ["", "", ""];
}
function temp(t){ const r = Math.round(t); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r) + " °C"; }
function wxLine(spec, d){
  let s = "";
  const place = WX && WX.day === ymd(PLAN_DATE) && WX[spec.place];
  const h = Math.min(Math.max(Math.round(spec.at / 60), 0), 23);
  if (place && place.h && place.h[h]) {
    const x = place.h[h], w = wmo(x.c);
    const desc = [w[0], w[d.wi]].filter(Boolean).join(" ");
    s = d.city[spec.place] + ", ≈ " + pad(h) + ":00: " + [desc, temp(x.t)].filter(Boolean).join(", ");
    if (x.p != null) s += " · " + d.rain(x.p);
  }
  if (spec.sunset) s = s ? s + " · " + d.sunset(hm(PLAN.sunset)) : d.city.berlin + ": " + d.sunset(hm(PLAN.sunset));
  return s;
}
function fillWeather(){
  const d = T[LANG];
  document.querySelectorAll(".wx").forEach((el) => {
    const step = STEPS[Number(el.dataset.i)];
    el.textContent = step && step.wx ? wxLine(step.wx, d) : "";
  });
  const has = WX && WX.ts && WX.day === ymd(PLAN_DATE);
  if (has) {
    const t = new Date(WX.ts);
    $("credits").innerHTML = d.credit(pad(t.getDate()) + "." + pad(t.getMonth() + 1), pad(t.getHours()) + ":" + pad(t.getMinutes()));
  } else {
    $("credits").innerHTML = "";
  }
}
function getJson(url, ms){
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, ms);
  return fetch(url, ctrl ? { signal: ctrl.signal } : {})
    .then((r) => { clearTimeout(timer); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch((e) => { clearTimeout(timer); throw e; });
}
function loadWeather(){
  const day = ymd(PLAN_DATE);
  const keys = Object.keys(PLACES);
  return Promise.all(keys.map((k) => {
    const p = PLACES[k];
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
      "&hourly=temperature_2m,precipitation_probability,weather_code" +
      "&timezone=Europe%2FBerlin&start_date=" + day + "&end_date=" + day;
    return getJson(url, 8000).then((j) => ({ k: k, j: j }), () => null);
  })).then((results) => {
    const next = (WX && WX.day === day) ? Object.assign({}, WX) : { day: day };
    let got = false;
    results.forEach((res) => {
      if (!res || !res.j || !res.j.hourly || !res.j.hourly.time) return;
      const H = res.j.hourly, out = { h: {} };
      H.time.forEach((tm, i) => {
        if (String(tm).slice(0, 10) !== day) return;
        const hour = Number(String(tm).slice(11, 13));
        const t = H.temperature_2m ? H.temperature_2m[i] : null;
        if (t == null) return;
        out.h[hour] = { t: t, p: H.precipitation_probability ? H.precipitation_probability[i] : null, c: H.weather_code ? H.weather_code[i] : null };
      });
      if (Object.keys(out.h).length) { next[res.k] = out; got = true; }
    });
    if (got) {
      next.ts = Date.now();
      next.day = day;
      WX = next;
      store("trip-ret-wx", JSON.stringify(WX));
      fillWeather();
    }
  });
}

/* ---------- start ---------- */
let start = (location.hash || "").replace("#", "");
if (!T[start]) start = load("trip-lang") || "";
if (!T[start]) start = "uk";
LANG = start;
try { const cached = JSON.parse(load("trip-ret-wx") || "null"); if (cached && cached.ts) WX = cached; } catch (e) {}

document.querySelectorAll(".lang-switch button").forEach((b) =>
  b.addEventListener("click", () => { LANG = b.dataset.lang; render(); window.scrollTo(0, 0); })
);
$("sizeBtn").addEventListener("click", () => { BIG = !BIG; store("trip-size", BIG ? "lg" : ""); applySize(); });

render();
setInterval(tick, 30000);
loadWeather();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  tick();
  if (!WX || !WX.ts || Date.now() - WX.ts > 60 * 60 * 1000) loadWeather();
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
